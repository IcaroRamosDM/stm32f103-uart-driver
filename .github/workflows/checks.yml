name: Checks
"on":
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check C formatting
        run: |
          python3 -m venv "$RUNNER_TEMP/style"
          "$RUNNER_TEMP/style/bin/pip" install clang-format==23.1.3
          git ls-files -z '*.c' '*.h' | xargs -0 -r "$RUNNER_TEMP/style/bin/clang-format" --dry-run --Werror --
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
      - name: Prepare pinned libopencm3
        run: |
          git clone https://github.com/libopencm3/libopencm3.git "$RUNNER_TEMP/libopencm3"
          git -C "$RUNNER_TEMP/libopencm3" checkout --detach 87a080c94ce67643216464821c752c1c406c6414
          make -C "$RUNNER_TEMP/libopencm3" TARGETS=stm32/f1 -j2
      - name: Host tests
        run: make test
      - name: Host sanitizers
        run: make sanitize
      - name: Cross-compile firmware
        run: |
          make -j2 OPENCM3_DIR="$RUNNER_TEMP/libopencm3" all
